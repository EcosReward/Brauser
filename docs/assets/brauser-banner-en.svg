<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Brauser English banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#10182d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="160" r="220" fill="#10b981" opacity="0.08"/>
  <circle cx="220" cy="760" r="260" fill="#3b82f6" opacity="0.10"/>

  <text x="96" y="170" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800">Brauser Security Lab</text>
  <text x="96" y="240" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="32">Browse safer. Audit every site.</text>
  <text x="96" y="300" fill="#67e8f9" font-family="Consolas, monospace" font-size="22">Check the site  then trust it.</text>

  <rect x="96" y="360" width="280" height="56" rx="16" fill="url(#btn)"/>
  <text x="140" y="396" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Full security check</text>

  <g transform="translate(820 180)">
    <rect width="680" height="560" rx="24" fill="#0b101e" stroke="#1e293b" stroke-width="2"/>
    <rect width="680" height="54" rx="24" fill="#0a0f1d"/>
    <rect y="40" width="680" height="14" fill="#0a0f1d"/>
    <circle cx="28" cy="27" r="6" fill="#ef4444"/>
    <circle cx="50" cy="27" r="6" fill="#f59e0b"/>
    <circle cx="72" cy="27" r="6" fill="#22c55e"/>
    <text x="110" y="33" fill="#94a3b8" font-family="Consolas, monospace" font-size="16">brauser.local  security lab</text>

    <rect x="24" y="74" width="420" height="36" rx="10" fill="#070b16" stroke="#334155"/>
    <text x="40" y="98" fill="#34d399" font-family="Consolas, monospace" font-size="14">HTTPS  example.com</text>
    <rect x="460" y="74" width="90" height="36" rx="10" fill="url(#btn)"/>
    <text x="478" y="98" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Open</text>

    <rect x="24" y="128" width="632" height="70" rx="14" fill="#0c1c27" stroke="#065f46"/>
    <rect x="40" y="146" width="120" height="34" rx="10" fill="#10b981" opacity="0.2" stroke="#34d399"/>
    <text x="58" y="169" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">SAFE</text>
    <text x="180" y="158" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Site looks safe</text>
    <text x="180" y="182" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">No critical issues found</text>
    <text x="560" y="172" fill="url(#accent)" font-family="Consolas, monospace" font-size="28" font-weight="800">97</text>
    <text x="610" y="172" fill="#64748b" font-family="Consolas, monospace" font-size="14">/100</text>

    <rect x="24" y="220" width="300" height="300" rx="14" fill="#090d18" stroke="#1e293b"/>
    <text x="44" y="255" fill="#64748b" font-family="Consolas, monospace" font-size="12">VIEWPORT</text>
    <text x="44" y="300" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Your website</text>
    <text x="44" y="334" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="14">Browse pages, then scan</text>

    <rect x="344" y="220" width="312" height="300" rx="14" fill="#0b101e" stroke="#1e293b"/>
    <rect x="364" y="244" width="272" height="42" rx="12" fill="url(#btn)"/>
    <text x="400" y="271" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">FULL SECURITY CHECK</text>
    <text x="364" y="320" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">MODULES</text>
    <text x="364" y="350" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14">TLS · Headers · Cookies</text>
    <text x="364" y="378" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14">XSS · SQLi · Ports</text>
    <text x="364" y="406" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Admin · Exposed files</text>
    <text x="364" y="450" fill="#34d399" font-family="Consolas, monospace" font-size="13">Beginner-friendly findings</text>
  </g>
</svg>
